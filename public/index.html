<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Sistem Laporan Penjualan</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --primary:#2563eb;
  --bg:#f3f4f6;
  --text:#111827;
  --muted:#6b7280;
  --border:#e5e7eb;
  --danger:#dc2626;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px 10px;
}
.container{
  width:100%;
  max-width:420px;
  background:#fff;
  padding:30px;
  border-radius:14px;
  border:1px solid var(--border);
}
.container.wide{
  max-width:850px;
}
h1{text-align:center;font-size:22px;margin:0 0 6px}
.subtitle{text-align:center;font-size:14px;color:var(--muted);margin-bottom:20px}
.meta{text-align:center;font-size:13px;color:var(--muted)}
input,button{
  width:100%;
  padding:13px;
  font-size:15px;
  border-radius:10px;
  margin-bottom:14px;
}
input{
  border:1px solid var(--border);
  text-transform:uppercase;
}
button{
  border:none;
  cursor:pointer;
  font-weight:600;
}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:disabled{opacity:.6}
.btn-logout{
  background:#f9fafb;
  border:1px solid var(--border);
  color:var(--danger);
}
.upload-box{
  border:2px dashed var(--border);
  border-radius:12px;
  padding:22px;
  text-align:center;
  cursor:pointer;
  color:var(--primary);
  font-weight:600;
  background:#f9fafb;
  display:block;
  margin-bottom:14px;
}
.upload-box input{display:none}
.status{text-align:center;font-size:14px;color:var(--muted);margin-top:10px}
.spinner{
  width:32px;height:32px;
  border:4px solid #e5e7eb;
  border-top:4px solid var(--primary);
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:16px auto;
}
@keyframes spin{to{transform:rotate(360deg)}}
.total{text-align:center;margin:20px 0}
.total .label{font-size:13px;color:var(--muted)}
.total .value{font-size:32px;font-weight:700;color:var(--primary)}
.error{text-align:center;color:var(--danger);font-size:14px}

.announce{
  background:#eef2ff;
  border:1px solid #c7d2fe;
  color:#1e3a8a;
  padding:14px;
  border-radius:10px;
  font-size:14px;
  margin:14px 0;
  text-align:center;
}
.announce a{
  color:#1d4ed8;
  font-weight:600;
  text-decoration:none;
}
.announce a:hover{text-decoration:underline}

/* STYLES STRUK & LIST PENJUALAN */
.receipt-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
  margin-top: 20px;
  text-align: left;
}
@media (min-width: 640px) {
  .receipt-grid {
    grid-template-columns: 1fr 1fr;
  }
}
.receipt-list {
  border: 1px solid var(--border);
  border-radius: 10px;
  max-height: 400px;
  overflow-y: auto;
  background: #fafafa;
  padding: 8px;
}
.receipt-item {
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 8px;
  cursor: pointer;
  background: #fff;
  transition: all 0.15s ease;
  line-height: 1.6;
}
.receipt-item:hover {
  background: #f3f4f6;
  transform: translateY(-1px);
}
.receipt-item.active {
  border-color: var(--primary);
  background: #eef2ff;
}
.receipt-preview {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  font-family: Consolas, "Courier New", monospace;
  font-size: 13px;
  line-height: 1.35;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 400px;
  overflow-y: auto;
  color: #111827;
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
}

#uploadPage,#resultPage{display:none}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="container fade" id="loginPage">
  <h1>Login Sistem</h1>
  <p class="subtitle">Masukkan username terdaftar</p>

  <input id="username" placeholder="USERNAME">
  <button class="btn-primary" onclick="login()">Masuk</button>

  <p class="error" id="error"></p>
</div>

<!-- UPLOAD -->
<div class="container fade" id="uploadPage">
  <h1>Sistem Laporan Penjualan</h1>
  <div class="meta" id="welcomeText"></div>
  <div class="meta" id="todayText"></div>
  <div class="meta" id="expiredInfo"></div>

  <div class="announce">
    📢 <strong>Pengumuman</strong><br>
    Wajib bergabung ke grup WhatsApp resmi<br>
    👉 <a href="https://chat.whatsapp.com/" target="_blank">
      Gabung Grup WhatsApp
    </a>
  </div>

  <form id="form">
    <label class="upload-box">
      <input type="file" id="zipInput" accept=".zip" required>
      <span id="fileLabel">Upload File ZIP</span>
    </label>
    <button class="btn-primary" id="submitBtn">Proses</button>
  </form>

  <div id="uploadResult"></div>
  <div class="status" id="statusText"></div>

  <button class="btn-logout" onclick="logout()">Logout</button>
</div>

<!-- RESULT -->
<div class="container wide fade" id="resultPage">
  <h1 id="resultTitle">Hasil Laporan Setoran</h1>
  <div class="meta" id="resultDetail"></div>
  
  <div class="total">
    <div class="label">TOTAL SETORAN TUNAI</div>
    <div class="value" id="totalValue">Rp 0</div>
    <div class="meta" id="resultKasirInfo" style="margin-top: 6px;"></div>
  </div>

  <!-- AREA DETAIL STRUK -->
  <div id="receiptArea" style="display:none;">
    <div class="receipt-grid">
      <div>
        <div style="font-weight:bold; font-size:14px; margin-bottom:8px;">Daftar Struk (<span id="totalReceiptCount">0</span>)</div>
        <div class="receipt-list" id="receiptList"></div>
      </div>
      <div>
        <div style="font-weight:bold; font-size:14px; margin-bottom:8px;">Preview Struk</div>
        <pre class="receipt-preview" id="receiptPreview">Pilih struk untuk melihat detail...</pre>
      </div>
    </div>
  </div>

  <div style="margin-top: 24px;">
    <button class="btn-primary" onclick="uploadAgain()">Upload Lagi</button>
    <button class="btn-logout" onclick="logout()">Logout</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyAvl_paDtkaHgPM2F1PRtybh_EanGfDT_Q",
  databaseURL: "https://serversetoran-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "serversetoran"
});
const db = getDatabase(app);

let userStoreId="";
let expiredDate="";

const todayID=()=>new Date().toLocaleDateString("id-ID",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});
const dateID=d=>new Date(d).toLocaleDateString("id-ID",{day:"2-digit",month:"long",year:"numeric"});

window.login = async ()=>{
  error.textContent="";
  const u=username.value.trim().toUpperCase();
  if(!u) return error.textContent="Username wajib diisi";

  try {
    const snap=await get(ref(db,"userList"));
    let user=null;

    snap.forEach(c=>{
      const v=c.val();
      if(v.username===u){
        user=v;
      }
    });

    if(!user) return error.textContent="Akun tidak ditemukan";

    const today=new Date().toISOString().split("T")[0];
    if(user.expired < today) return error.textContent="Akun sudah expired";

    userStoreId=user.storeId;
    expiredDate=user.expired;

    loginPage.style.display="none";
    uploadPage.style.display="block";
    welcomeText.textContent="Selamat datang, "+u;
    todayText.textContent="Tanggal: "+todayID();
    expiredInfo.textContent="Aktif s/d "+dateID(expiredDate);
  } catch (err) {
    error.textContent = "Gagal terhubung ke server";
  }
};

zipInput.onchange=()=>{
  fileLabel.textContent=zipInput.files[0]?.name || "Upload File ZIP";
};

form.onsubmit=async e=>{
  e.preventDefault();
  submitBtn.disabled=true;
  statusText.textContent="⏳ Memproses file...";
  statusText.style.color="var(--muted)";
  uploadResult.innerHTML=`<div class="spinner"></div>`;

  const fd=new FormData();
  fd.append("zipfile",zipInput.files[0]);
  fd.append("storeId",userStoreId);

  try {
    const r=await fetch("/api/setoran",{method:"POST",body:fd});
    const j=await r.json();

    submitBtn.disabled=false;

    if(!r.ok || j.error){
      uploadResult.innerHTML="";
      statusText.textContent=j.error || "Terjadi kesalahan sistem";
      statusText.style.color="var(--danger)";
      return;
    }

    uploadPage.style.display="none";
    resultPage.style.display="block";
    
    // Set Header & Detail Result
    resultTitle.textContent=j.title || "Hasil Laporan Setoran";
    resultDetail.textContent=j.detail;
    totalValue.textContent="Rp "+(j.hasil || 0).toLocaleString("id-ID");
    resultKasirInfo.textContent=`Tanggal: ${j.tanggal} | NIK Kasir: ${j.nik_kasir}`;

    // Render Struk Laporan
    if(j.receipts && j.receipts.length > 0) {
      receiptArea.style.display = "block";
      totalReceiptCount.textContent = j.total_receipt || j.receipts.length;
      receiptList.innerHTML = "";

      j.receipts.forEach((r) => {
        const item = document.createElement("div");
        item.className = "receipt-item";
        
        const cash = Number(r.cash || 0);
        const change = Number(r.change_pay || 0);
        const net = cash - change;

        item.innerHTML = `
          <div><b>No Bon :</b> ${r.bill_no}</div>
          <div><b>Tanggal :</b> ${r.date_tx}</div>
          <div><b>No Member :</b> ${r.cust_id || '-'}</div>
          <div><b>No HP :</b> ${r.phone || '-'}</div>
          <div><b>Tunai :</b> Rp ${cash.toLocaleString('id-ID')}</div>
          <div><b>Kembalian :</b> Rp ${change.toLocaleString('id-ID')}</div>
          <div style="color:var(--primary); font-weight:bold;"><b>Setoran :</b> Rp ${net.toLocaleString('id-ID')}</div>
        `;

        item.onclick = () => {
          document.querySelectorAll('.receipt-item').forEach(el => el.classList.remove('active'));
          item.classList.add('active');
          showReceiptPreview(r);
        };
        receiptList.appendChild(item);
      });

      // Tampilkan struk pertama secara otomatis
      if(receiptList.children[0]) receiptList.children[0].click();
    } else {
      receiptArea.style.display = "none";
    }

  } catch(err) {
    submitBtn.disabled=false;
    uploadResult.innerHTML="";
    statusText.textContent="Gagal mengirim data ke server";
    statusText.style.color="var(--danger)";
  }
};

function showReceiptPreview(r) {
  const content = [
    r.header,
    r.body1,
    r.body2,
    r.body3,
    r.addtl1,
    r.addtl2,
    r.addtl3,
    r.footer
  ]
  .filter(Boolean)
  .join("\n")
  .replace(/\|/g, "\n"); // Mengubah simbol '|' menjadi baris baru agar rapi

  receiptPreview.textContent = content || "Detail struk kosong.";
}

window.uploadAgain=()=>{
  form.reset();
  uploadResult.innerHTML="";
  statusText.textContent="";
  fileLabel.textContent="Upload File ZIP";
  resultPage.style.display="none";
  uploadPage.style.display="block";
};

window.logout=()=>location.reload();
</script>

</body>
</html>
